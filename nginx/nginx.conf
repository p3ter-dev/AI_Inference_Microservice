# Nginx – Layer 7 gRPC Reverse Proxy & Load Balancer
#
# Key points:
#   • http2  on        – required; gRPC runs exclusively on HTTP/2
#   • grpc_pass        – nginx-native directive for proxying gRPC traffic
#   • upstream block   – round-robin across three identical backend replicas
#   • grpc_read_timeout / send_timeout – generous values for streaming RPCs


worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Upstream pool (Round Robin is the default scheduler)
    upstream grpc_backends {
        server grpc_server_1:50051;
        server grpc_server_2:50051;
        server grpc_server_3:50051;

        # Keepalive connections to backends – reduces TCP handshake overhead
        keepalive 32;
    }

    # Logging
    log_format grpc_log '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'upstream=$upstream_addr';

    access_log /var/log/nginx/access.log grpc_log;
    error_log  /var/log/nginx/error.log  warn;

    # Virtual server
    server {
        listen 80 http2;   # HTTP/2 is mandatory for gRPC

        # Large timeouts needed for long-running bidirectional streams
        grpc_read_timeout  300s;
        grpc_send_timeout  300s;
        client_body_timeout 300s;

        # Route all gRPC traffic to the upstream pool
        location / {
            grpc_pass grpc://grpc_backends;

            # Propagate request headers so backends see the real client
            grpc_set_header Host            $host;
            grpc_set_header X-Real-IP       $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Surface gRPC error codes correctly in HTTP/2 trailers
            error_page 502 = /error502grpc;
        }

        location = /error502grpc {
            internal;
            default_type application/grpc;
            add_header  grpc-status 14;
            add_header  content-length 0;
            return 204;
        }
    }
}
